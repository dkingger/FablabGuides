<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fablab – guide til højdeindstilling på Eduard laserskærer.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Fablab">
  <title>Laserskærer – Eduard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #d2e2d0; color: #222; line-height: 1.6; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1, h2 { color: #3a4f41; text-align: center; }
    .carousel { position: relative; width: 100%; max-width: 500px; margin: 20px auto; }
    .carousel img { width: 100%; border-radius: 5px; cursor: pointer; }
    .caption { text-align: center; font-size: 1rem; margin-top: 10px; }
    .carousel-controls { display: flex; justify-content: space-between; margin-top: 10px; }
    .carousel-controls button, a, .top-button { background-color: #3a4f41; color: white; border: none; padding: 10px 20px; font-size: 1rem; cursor: pointer; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 25px; }
    .carousel-controls button:hover, a:hover, .top-button:hover { background-color: #c94f3c; }
    #imageModal { display: none; position: fixed; z-index: 1000; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); }
    #modalImg { margin: auto; display: block; max-width: 90vw; max-height: 80vh; }
    #imageModal .close { position: absolute; top: 30px; right: 50px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }
  </style>
    <link rel="icon" type="image/x-icon" href="/billeder/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/billeder/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/billeder/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/billeder/apple-touch-icon.png">
    <link rel="manifest" href="/billeder/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="FabLab">
</head>
<body id="top">
  <div id="imageModal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modalImg" src="" alt="Forstørret billede">
  </div>

  <h1>Laserskærer: Eduard</h1>
  <p>Herunder finder du en trin-for-trin guide til at sætte materialetykkelse på Eduard.</p>

  <div class="carousel">
    <img id="carouselImage" src="" alt="Eduard billede" onclick="openModal(this.src)">
    <div class="caption" id="carouselCaption"></div>
    <div class="carousel-controls">
      <button onclick="prevSlide()">Tilbage</button>
      <button onclick="nextSlide()">Næste</button>
    </div>
  </div>

  <a href="index.html">Tilbage til forsiden</a>
  <a class="top-button" href="#top">Til toppen</a>

  <script>
    const images = [
      { src: "billeder/laser/hoejde_eduard/00materiale_i_maskine.jpeg", caption: "1. Læg materialet ind i maskinen" },
      { src: "billeder/laser/hoejde_eduard/01fokusbrik.jpeg", caption: "2. Placer fokusbrikken på materialet" },
      { src: "billeder/laser/hoejde_eduard/02tryk_zu.jpeg", caption: "3. Tryk på Z/U for at justere Z-aksen" },
      { src: "billeder/laser/hoejde_eduard/03saet_z_hoejde.jpeg", caption: "4. Brug piletasterne til at justere højden op og ned" },
      { src: "billeder/laser/hoejde_eduard/04korrekt_hoejde.jpeg", caption: "5. Når brikken netop passer til den riflede kant på laserhovedet, er højden korrekt" }
    ];
    let index = 0;
    function updateSlide() {
      document.getElementById("carouselImage").src = images[index].src;
      document.getElementById("carouselCaption").textContent = images[index].caption;
    }
    function nextSlide() { index = (index + 1) % images.length; updateSlide(); }
    function prevSlide() { index = (index - 1 + images.length) % images.length; updateSlide(); }
    function openModal(src) {
      document.getElementById("modalImg").src = src;
      document.getElementById("imageModal").style.display = "block";
    }
    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }
    window.onclick = function(event) {
      const modal = document.getElementById("imageModal");
      if (event.target === modal) closeModal();
    };
    updateSlide();
  </script>
    <script src="/install-app.js" defer></script>
</body>
</html>
