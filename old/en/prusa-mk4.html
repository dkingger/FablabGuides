<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prusa MK4 – Guide</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d2e2d0;
            color: #222;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: #3a4f41;
        }
        h2 {
            margin-top: 40px;
            color: #444;
        }
        h3 {
            margin-top: 20px;
            color: #555;
        }
        ul {
            list-style-type: disc;
            margin-left: 20px;
        }
        a, .top-button {
            display: inline-block;
            margin-top: 30px;
            background-color: #3a4f41;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover, .top-button:hover {
            background-color: #c94f3c;
        }
        .carousel {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
        }
        .carousel img {
            width: 100%;
            border-radius: 5px;
        }
        .carousel .caption {
            text-align: center;
            font-size: 1rem;
            margin-top: 10px;
        }
        .carousel-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .carousel-controls button {
            background-color: #3a4f41;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }
        .carousel-controls button:hover {
            background-color: #c94f3c;
        }
    </style>
    <link rel="icon" type="image/x-icon" href="/billeder/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/billeder/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/billeder/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/billeder/apple-touch-icon.png">
    <link rel="manifest" href="/billeder/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="FabLab">
</head>
<body>
    <a name="top"></a>
    <h1>Prusa MK4</h1>
    <p>The Prusa MK4 is an advanced 3D printer with many automatic features. Below you will find guides for changing filament and starting a print.</p>

    <h2>Change filament</h2>
    <div class="carousel">
        <img id="carouselImage" src="../billeder/3dprinter/prusamk4/skift_fillament/01_vaelgfillament.jpeg" alt="Change filament image">
        <div class="caption" id="carouselCaption">1. Select "Filament" in the menu</div>
        <div class="carousel-controls">
            <button onclick="prevSlide()">Back</button>
            <button onclick="nextSlide()">Next</button>
        </div>
    </div>

    <h2>Start print</h2>
    <div class="carousel">
        <img id="startPrintImage" src="../billeder/3dprinter/prusamk4/start_print/00_rensprintplade.jpeg" alt="Start print image">
        <div class="caption" id="startPrintCaption">1. Clean the build plate</div>
        <div class="carousel-controls">
            <button onclick="prevPrintSlide()">Back</button>
            <button onclick="nextPrintSlide()">Next</button>
        </div>
    </div>

    <a href="index.html">Back to frontpage</a>
    <a class="top-button" href="#top">Back to top</a>

    <script>
        const images = [
            { src: "../billeder/3dprinter/prusamk4/skift_fillament/01_vaelgfillament.jpeg", caption: "1. Select 'Filament' in the menu" },
            { src: "../billeder/3dprinter/prusamk4/skift_fillament/02_loadfillament.jpeg", caption: "2. Select 'Load Filament'" },
            { src: "../billeder/3dprinter/prusamk4/skift_fillament/03_vaelgtype.jpeg", caption: "3. Select filament type, e.g. PLA" },
            { src: "../billeder/3dprinter/prusamk4/skift_fillament/04_indsaetfillament.jpeg", caption: "4. Insert the filament into the extruder" },
            { src: "../billeder/3dprinter/prusamk4/skift_fillament/05_trykfortsaet.jpeg", caption: "5. Press 'Continue' when the filament is inserted" },
            { src: "../billeder/3dprinter/prusamk4/skift_fillament/06_kontrollerfarveskift.jpeg", caption: "6. Check that the filament is correctly inserted and the color has changed" }
        ];

        const printImages = [
            { src: "../billeder/3dprinter/prusamk4/start_print/00_rensprintplade.jpeg", caption: "1. Clean the build plate" },
            { src: "../billeder/3dprinter/prusamk4/start_print/01_indsaetusbogstart.jpeg", caption: "2. Insert USB with G-code. The newest file loads automatically." },
            { src: "../billeder/3dprinter/prusamk4/start_print/02_vedforkertfil.jpeg", caption: "3. If correct, go to image 6. If not, press 'Back'" },
            { src: "../billeder/3dprinter/prusamk4/start_print/03_trykprint.jpeg", caption: "4. Press 'Print'" },
            { src: "../billeder/3dprinter/prusamk4/start_print/04_vaelgfil.jpeg", caption: "5. Select the desired file" },
            { src: "../billeder/3dprinter/prusamk4/start_print/05_trykprint.jpeg", caption: "6. Press 'Print' again to confirm" },
            { src: "../billeder/3dprinter/prusamk4/start_print/06_ledprintstart.jpeg", caption: "7. LED lights up at print start" },
            { src: "../billeder/3dprinter/prusamk4/start_print/07_kontrollerfoerstelag.jpeg", caption: "8. Watch the first layer and adjust if necessary" },
            { src: "../billeder/3dprinter/prusamk4/start_print/08_displayskifttid.jpeg", caption: "9. Display shows estimated time and status" }
        ];

        let currentIndex = 0;
        let currentPrintIndex = 0;

        function updateCarousel() {
            document.getElementById("carouselImage").src = images[currentIndex].src;
            document.getElementById("carouselCaption").textContent = images[currentIndex].caption;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % images.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateCarousel();
        }

        function updatePrintCarousel() {
            document.getElementById("startPrintImage").src = printImages[currentPrintIndex].src;
            document.getElementById("startPrintCaption").textContent = printImages[currentPrintIndex].caption;
        }

        function nextPrintSlide() {
            currentPrintIndex = (currentPrintIndex + 1) % printImages.length;
            updatePrintCarousel();
        }

        function prevPrintSlide() {
            currentPrintIndex = (currentPrintIndex - 1 + printImages.length) % printImages.length;
            updatePrintCarousel();
        }

        updateCarousel();
        updatePrintCarousel();
    </script>
    <script src="/install-app.js" defer></script>
</body>
</html>
