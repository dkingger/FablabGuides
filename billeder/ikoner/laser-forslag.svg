<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Laser cutter draft</title>
  <desc id="desc">Draft illustration of a laser cutter on transparent background.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46515f"/>
      <stop offset="100%" stop-color="#202833"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8cc4da" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb321"/>
      <stop offset="100%" stop-color="#f27700"/>
    </linearGradient>
  </defs>
  <ellipse cx="320" cy="540" rx="210" ry="28" fill="#0c1117" opacity="0.18"/>
  <rect x="120" y="190" width="400" height="220" rx="26" fill="url(#body)"/>
  <rect x="145" y="215" width="350" height="95" rx="14" fill="url(#glass)"/>
  <rect x="145" y="328" width="350" height="56" rx="12" fill="#161c24"/>
  <path d="M345 230l-70 110" stroke="#ff5522" stroke-width="12" stroke-linecap="round"/>
  <circle cx="345" cy="230" r="16" fill="url(#accent)"/>
  <rect x="180" y="408" width="280" height="20" rx="10" fill="#10161d"/>
  <rect x="132" y="398" width="26" height="42" rx="8" fill="url(#accent)"/>
  <rect x="482" y="398" width="26" height="42" rx="8" fill="url(#accent)"/>
</svg>
