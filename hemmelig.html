<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hemmelig side</title>
  <style>
    body {
      margin:0; display:flex; align-items:center; justify-content:center;
      height:100vh; background:#d2e2d0; font-family:Arial, sans-serif;
    }
    iframe {
      width:90%; height:90%; border:none;
      box-shadow:0 0 12px rgba(0,0,0,.2); border-radius:8px;
    }
  </style>
</head>
<body>
<iframe id="sheetFrame" style="width:90%;height:90%;border:none;border-radius:8px;"></iframe>
<script>
  // Korrekt Base64 (én linje, ingen mellemrum)
  const encoded = "aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvMWR6Zkc2dGwyc1BXdFVrbGNEZzhKenNJRTZTR2dKTFF6Y1JrVlhPVEVCbEUvZWRpdD91c3A9c2hhcmluZw==";
  const url = atob(encoded);
  document.getElementById("sheetFrame").src = url;
</script>

<p id="fallback" style="display:none;">
  Kunne ikke indlæse i iframe.
  <a id="openLink" target="_blank" rel="noopener">Åbn regnearket</a>
</p>
<script>
  const frame = document.getElementById("sheetFrame");
  const fb = document.getElementById("fallback");
  const a = document.getElementById("openLink");
  a.href = url;

  let done = false;
  const t = setTimeout(()=>{ if(!done){ fb.style.display = "block"; } }, 2000);
  frame.onload = ()=>{ done = true; clearTimeout(t); fb.style.display = "none"; };
</script>

</body>
</html>
