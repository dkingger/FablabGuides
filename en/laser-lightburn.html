<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fablab Spinderihallerne – guide for LightBurn workflow.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Fablab Spinderihallerne">
  <title>Laser Cutter – LightBurn</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #d2e2d0; color: #222; line-height: 1.6; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #3a4f41; text-align: center; }
    .carousel { position: relative; width: 100%; max-width: 500px; margin: 20px auto; }
    .carousel img { width: 100%; border-radius: 5px; cursor: pointer; }
    .caption { text-align: center; font-size: 1rem; margin-top: 10px; }
    .carousel-controls { display: flex; justify-content: space-between; margin-top: 10px; }
    .carousel-controls button, a, .top-button { background-color: #3a4f41; color: white; border: none; padding: 10px 20px; font-size: 1rem; cursor: pointer; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 25px; }
    .carousel-controls button:hover, a:hover, .top-button:hover { background-color: #c94f3c; }
    #imageModal { display: none; position: fixed; z-index: 1000; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); }
    #modalImg { margin: auto; display: block; max-width: 90vw; max-height: 80vh; }
    #imageModal .close { position: absolute; top: 30px; right: 50px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body id="top">
  <div id="imageModal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modalImg" src="" alt="Enlarged image">
  </div>

  <h1>Laser Cutter: LightBurn</h1>
  <p>Below is a step-by-step guide for LightBurn workflow.</p>

  <div class="carousel">
    <img id="carouselImage" src="" alt="LightBurn image" onclick="openModal(this.src)">
    <div class="caption" id="carouselCaption"></div>
    <div class="carousel-controls">
      <button onclick="prevSlide()">Back</button>
      <button onclick="nextSlide()">Next</button>
    </div>
  </div>

  <a href="index.html">Back to frontpage</a>
  <a class="top-button" href="#top">Back to top</a>

  <script>
    const images = [
      { src: "../billeder/laser/lightburn/01tom_skaerm.jpeg", caption: "1. Start LightBurn or select New in the File tab" },
      { src: "../billeder/laser/lightburn/02reset_to_default.jpeg", caption: "2. Restore default settings if functions are missing" },
      { src: "../billeder/laser/lightburn/03importer_tegning.jpeg", caption: "3. Import drawing" },
      { src: "../billeder/laser/lightburn/04farver.jpeg", caption: "4. Check that all required layers/colors are present" },
      { src: "../billeder/laser/lightburn/05vaelg_farve.jpeg", caption: "5. Select e.g. the cut layer" },
      { src: "../billeder/laser/lightburn/06skaering.jpeg", caption: "6. Select material and function in the material library and click Assign" },
      { src: "../billeder/laser/lightburn/07fyld_gravering.jpeg", caption: "7. Full engraving = filled shape" },
      { src: "../billeder/laser/lightburn/08linje_gravering.jpeg", caption: "8. Line engraving = empty shape" },
      { src: "../billeder/laser/lightburn/09skift_til_laser.jpeg", caption: "9. Switch to laser view" },
      { src: "../billeder/laser/lightburn/10marker_hele_figuren.jpeg", caption: "10. Select everything that should be cut/engraved" },
      { src: "../billeder/laser/lightburn/11saet_origin_ightburn.jpeg", caption: "11. Set origin in LightBurn" },
      { src: "../billeder/laser/lightburn/12saet_origin_paa_laser.jpeg", caption: "12. Set the same origin physically on the machine" },
      { src: "../billeder/laser/lightburn/13frame_og_start_laser.jpeg", caption: "13. Use Frame and start the laser" }
    ];
    let index = 0;
    function updateSlide() {
      document.getElementById("carouselImage").src = images[index].src;
      document.getElementById("carouselCaption").textContent = images[index].caption;
    }
    function nextSlide() { index = (index + 1) % images.length; updateSlide(); }
    function prevSlide() { index = (index - 1 + images.length) % images.length; updateSlide(); }
    function openModal(src) {
      document.getElementById("modalImg").src = src;
      document.getElementById("imageModal").style.display = "block";
    }
    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }
    window.onclick = function(event) {
      const modal = document.getElementById("imageModal");
      if (event.target === modal) closeModal();
    };
    updateSlide();
  </script>
</body>
</html>
