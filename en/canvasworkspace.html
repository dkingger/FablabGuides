<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Workspace – Guide</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #d2e2d0;
      color: #222;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      color: #3a4f41;
    }
    h2 {
      margin-top: 40px;
      color: #444;
    }
    .carousel {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
    }
    .carousel img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .carousel .caption {
      text-align: center;
      font-size: 1rem;
      margin-top: 10px;
    }
    .carousel-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .carousel-controls button {
      background-color: #3a4f41;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 5px;
    }
    .carousel-controls button:hover {
      background-color: #c94f3c;
    }
    a.top-button {
      display: block;
      text-align: center;
      margin: 40px auto;
      background-color: #3a4f41;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      width: fit-content;
    }
  </style>
    <link rel="icon" type="image/x-icon" href="/billeder/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/billeder/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/billeder/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/billeder/apple-touch-icon.png">
    <link rel="manifest" href="/billeder/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="FabLab Vejle">
</head>
<body>
  <h1>Canvas Workspace</h1>
  <p style="text-align: center;">Below you can see step-by-step how to use Canvas Workspace.</p>

  <h2>Import SVG</h2>
  <div class="carousel">
    <img id="svgImage" src="" alt="Import SVG image">
    <div class="caption" id="svgCaption"></div>
    <div class="carousel-controls">
      <button onclick="prevSvgSlide()">Back</button>
      <button onclick="nextSvgSlide()">Next</button>
    </div>
  </div>

  <h2>Trace Image</h2>
  <div class="carousel">
    <img id="traceImage" src="" alt="Trace image">
    <div class="caption" id="traceCaption"></div>
    <div class="carousel-controls">
      <button onclick="prevTraceSlide()">Back</button>
      <button onclick="nextTraceSlide()">Next</button>
    </div>
  </div>

  <a class="top-button" href="index.html">Back to frontpage</a>

  <script>
    const svgImages = [
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/01.canvasworkspace.jpeg", caption: "1. Open Canvas Workspace" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/02.nytdokument.jpeg", caption: "2. Create a new document" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/03.grundskærm.jpeg", caption: "3. Start screen appears" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/04.navngivdokument.jpeg", caption: "4. Name the document" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/05.importersvg.jpeg", caption: "5. Click 'Import SVG'" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/06.aabensvg.jpeg", caption: "6. Select SVG file" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/07.placerbillede.jpeg", caption: "7. Place the image on the screen" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/08.downloadknap.jpeg", caption: "8. Click the download button" },
      { src: "../billeder/vinylskaerer/canvas_workspace/importersvg/09.gempåcomputer.jpeg", caption: "9. Save the file to a USB stick" }
    ];

    const traceImages = [
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/01.canvasworkspace.jpeg", caption: "1. Open Canvas Workspace" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/02.nytdokument.jpeg", caption: "2. Create a new document" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/03.grundskærm.jpeg", caption: "3. Start screen appears" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/04.navngivdokument.jpeg", caption: "4. Name the document" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/05.sporbillede.jpeg", caption: "5. Select 'Trace image'" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/06.aabenbillede.jpeg", caption: "6. Open image file" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/07.vaelgcolor.jpeg", caption: "7. Choose color option for tracing" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/08.preview.jpeg", caption: "8. Preview tracing" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/09.skygge.jpeg", caption: "9. Always select no here" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/10.download.jpeg", caption: "10. Download the project" },
      { src: "../billeder/vinylskaerer/canvas_workspace/sporbillede/11.vaelgcomputer.jpeg", caption: "11. Save to a USB stick" }
    ];

    let svgIndex = 0;
    let traceIndex = 0;

    function updateSvgCarousel() {
      document.getElementById("svgImage").src = svgImages[svgIndex].src;
      document.getElementById("svgCaption").textContent = svgImages[svgIndex].caption;
    }

    function updateTraceCarousel() {
      document.getElementById("traceImage").src = traceImages[traceIndex].src;
      document.getElementById("traceCaption").textContent = traceImages[traceIndex].caption;
    }

    function nextSvgSlide() {
      svgIndex = (svgIndex + 1) % svgImages.length;
      updateSvgCarousel();
    }

    function prevSvgSlide() {
      svgIndex = (svgIndex - 1 + svgImages.length) % svgImages.length;
      updateSvgCarousel();
    }

    function nextTraceSlide() {
      traceIndex = (traceIndex + 1) % traceImages.length;
      updateTraceCarousel();
    }

    function prevTraceSlide() {
      traceIndex = (traceIndex - 1 + traceImages.length) % traceImages.length;
      updateTraceCarousel();
    }

    // Initial view
    updateSvgCarousel();
    updateTraceCarousel();
  </script>
</body>
</html>
