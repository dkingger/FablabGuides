<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prusa Mini – Guide</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d2e2d0;
            color: #222;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: #3a4f41;
        }
        h2 {
            margin-top: 40px;
            color: #444;
        }
        h3 {
            margin-top: 20px;
            color: #555;
        }
        ul {
            list-style-type: disc;
            margin-left: 20px;
        }
        a, .top-button {
            display: inline-block;
            margin-top: 30px;
            background-color: #3a4f41;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover, .top-button:hover {
            background-color: #c94f3c;
        }
        .carousel {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
        }
        .carousel img {
            width: 100%;
            border-radius: 5px;
        }
        .carousel .caption {
            text-align: center;
            font-size: 1rem;
            margin-top: 10px;
        }
        .carousel-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .carousel-controls button {
            background-color: #3a4f41;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
        }
        .carousel-controls button:hover {
            background-color: #c94f3c;
        }
    </style>
    <link rel="icon" type="image/x-icon" href="/billeder/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/billeder/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/billeder/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/billeder/apple-touch-icon.png">
    <link rel="manifest" href="/billeder/site.webmanifest">
</head>
<body>
    <a name="top"></a>
    <h1>Prusa Mini</h1>
    <p>The Prusa Mini is a compact and reliable 3D printer, perfect for both beginners and experienced users. Below you will find step-by-step guides for the most important functions.</p>

    <h2>Change filament</h2>
    <div class="carousel">
        <img id="carouselImage" src="../billeder/3dprinter/prusamini/skift_fillament/01_taendprinter.jpeg" alt="Change filament image">
        <div class="caption" id="carouselCaption">1. Turn on the printer</div>
        <div class="carousel-controls">
            <button onclick="prevSlide()">Back</button>
            <button onclick="nextSlide()">Next</button>
        </div>
    </div>

    <h2>Start print</h2>
    <div class="carousel">
        <img id="startPrintImage" src="../billeder/3dprinter/prusamini/start_print/00_renspladen.jpeg" alt="Start print image">
        <div class="caption" id="startPrintCaption">1. Clean the build plate</div>
        <div class="carousel-controls">
            <button onclick="prevPrintSlide()">Back</button>
            <button onclick="nextPrintSlide()">Next</button>
        </div>
    </div>

    <a href="index.html">Back to frontpage</a>
    <a class="top-button" href="#top">Back to top</a>

    <script>
        const images = [
            { src: "../billeder/3dprinter/prusamini/skift_fillament/01_taendprinter.jpeg", caption: "1. Turn on the printer" },
            { src: "../billeder/3dprinter/prusamini/skift_fillament/02_vaelgfillament.jpeg", caption: "2. Select 'Filament' in the menu" },
            { src: "../billeder/3dprinter/prusamini/skift_fillament/03_loadfillament.jpeg", caption: "3. Select 'Load Filament'" },
            { src: "../billeder/3dprinter/prusamini/skift_fillament/04_indsaetfillament.jpeg", caption: "4. Insert the filament into the extruder" },
            { src: "../billeder/3dprinter/prusamini/skift_fillament/05_kontrolleratderkommerfillament.jpeg", caption: "5. Check that filament comes out" },
            { src: "../billeder/3dprinter/prusamini/skift_fillament/06_korrektfillament.jpeg", caption: "6. Ready to print" }
        ];

        const printImages = [
            { src: "../billeder/3dprinter/prusamini/start_print/00_renspladen.jpeg", caption: "1. Clean the build plate" },
            { src: "../billeder/3dprinter/prusamini/start_print/01_indsaetusbogprint.jpeg", caption: "2. Insert USB stick with G-code" },
            { src: "../billeder/3dprinter/prusamini/start_print/02_vaelgfil.jpeg", caption: "3. Select the file on the screen" },
            { src: "../billeder/3dprinter/prusamini/start_print/03_trykprint.jpeg", caption: "4. Press 'Print' and watch the first layer" }
        ];

        let currentIndex = 0;
        let currentPrintIndex = 0;

        function updateCarousel() {
            document.getElementById("carouselImage").src = images[currentIndex].src;
            document.getElementById("carouselCaption").textContent = images[currentIndex].caption;
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % images.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateCarousel();
        }

        function updatePrintCarousel() {
            document.getElementById("startPrintImage").src = printImages[currentPrintIndex].src;
            document.getElementById("startPrintCaption").textContent = printImages[currentPrintIndex].caption;
        }

        function nextPrintSlide() {
            currentPrintIndex = (currentPrintIndex + 1) % printImages.length;
            updatePrintCarousel();
        }

        function prevPrintSlide() {
            currentPrintIndex = (currentPrintIndex - 1 + printImages.length) % printImages.length;
            updatePrintCarousel();
        }

        updateCarousel();
        updatePrintCarousel();
    </script>
</body>
</html>
