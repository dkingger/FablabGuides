<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fablab Spinderihallerne – guides for laser cutter and LightBurn.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Fablab Spinderihallerne">
  <title>Laser Cutter – LightBurn Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #d2e2d0;
      color: #222;
      line-height: 1.6;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      color: #3a4f41;
      text-align: center;
    }
    h2 {
      margin-top: 40px;
      color: #3a4f41;
    }
    h3 {
      margin-top: 20px;
      color: #444;
    }
    a, .top-button {
      display: inline-block;
      margin-top: 30px;
      background-color: #3a4f41;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    a:hover, .top-button:hover {
      background-color: #c94f3c;
    }
    .carousel {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }
    .carousel img {
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
    }
    .carousel .caption {
      text-align: center;
      font-size: 1rem;
      margin-top: 10px;
    }
    .carousel-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .carousel-controls button {
      background-color: #3a4f41;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 5px;
    }
    .carousel-controls button:hover {
      background-color: #c94f3c;
    }
    #imageModal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 60px;
      left: 0; top: 0; width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }
    #modalImg {
      margin: auto;
      display: block;
      max-width: 90vw;
      max-height: 80vh;
    }
    #imageModal .close {
      position: absolute;
      top: 30px;
      right: 50px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
    <link rel="icon" type="image/x-icon" href="/billeder/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/billeder/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/billeder/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/billeder/apple-touch-icon.png">
    <link rel="manifest" href="/billeder/site.webmanifest">
</head>
<body>
  <div id="imageModal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="modalImg" src="">
  </div>

  <h1>Laser Cutter</h1>
  <p>Below you will find a step-by-step guide for using LightBurn with the laser cutter.</p>

  <h2 id="eduard">Set material thickness on Eduard laser</h2>
  <div class="carousel">
    <img id="carouselImage0" src="" alt="Eduard image" onclick="openModal(this.src)">
    <div class="caption" id="carouselCaption0"></div>
    <div class="carousel-controls">
      <button onclick="prevSlide0()">Back</button>
      <button onclick="nextSlide0()">Next</button>
    </div>
  </div>

  <h2 id="aeon">Set material thickness on AEON laser</h2>
  <div class="carousel">
    <img id="carouselImage1" src="" alt="AEON image" onclick="openModal(this.src)">
    <div class="caption" id="carouselCaption1"></div>
    <div class="carousel-controls">
      <button onclick="prevSlide1()">Back</button>
      <button onclick="nextSlide1()">Next</button>
    </div>
  </div>

  <h2 id="lightburn">LightBurn workflow</h2>
  <div class="carousel">
    <img id="carouselImage2" src="" alt="LightBurn image" onclick="openModal(this.src)">
    <div class="caption" id="carouselCaption2"></div>
    <div class="carousel-controls">
      <button onclick="prevSlide2()">Back</button>
      <button onclick="nextSlide2()">Next</button>
    </div>
  </div>

  <h2 id="epilog">Epilog</h2>
  <p>This guide is coming soon.</p>

  <a href="index.html">Back to frontpage</a>
  <a class="top-button" href="#top">Back to top</a>

  <script>
    const images0 = [
      { src: "../billeder/laser/hoejde_eduard/00materiale_i_maskine.jpeg", caption: "1. Place the material in the machine" },
      { src: "../billeder/laser/hoejde_eduard/01fokusbrik.jpeg", caption: "2. Place the focus brick on the material" },
      { src: "../billeder/laser/hoejde_eduard/02tryk_zu.jpeg", caption: "3. Press Z/U to adjust the Z-axis" },
      { src: "../billeder/laser/hoejde_eduard/03saet_z_hoejde.jpeg", caption: "4. Use the arrow keys to adjust the height up and down" },
      { src: "../billeder/laser/hoejde_eduard/04korrekt_hoejde.jpeg", caption: "5. When the brick just fits the grooved edge on the laser head, the height is correct" }
    ];
    let index0 = 0;
    function updateSlide0() {
      document.getElementById("carouselImage0").src = images0[index0].src;
      document.getElementById("carouselCaption0").textContent = images0[index0].caption;
    }
    function nextSlide0() { index0 = (index0 + 1) % images0.length; updateSlide0(); }
    function prevSlide0() { index0 = (index0 - 1 + images0.length) % images0.length; updateSlide0(); }

    const images1 = [
      { src: "../billeder/laser/hoejde_aeon/00forkert.jpg", caption: "1. Wrong height – the focus pen is not within the material" },
      { src: "../billeder/laser/hoejde_aeon/00rigtig.jpg", caption: "2. Correct height – the focus pen is within the material" },
      { src: "../billeder/laser/hoejde_aeon/01saethoej.jpg", caption: "3. Press the Z/U button to enter the menu on the laser cutter" },
      { src: "../billeder/laser/hoejde_aeon/02saethoej.jpg", caption: "4. Use the arrow key to select the Auto Focus function" },
      { src: "../billeder/laser/hoejde_aeon/03saethoej.jpg", caption: "5. Press the Enter button to focus the laser" }
    ];
    let index1 = 0;
    function updateSlide1() {
      document.getElementById("carouselImage1").src = images1[index1].src;
      document.getElementById("carouselCaption1").textContent = images1[index1].caption;
    }
    function nextSlide1() { index1 = (index1 + 1) % images1.length; updateSlide1(); }
    function prevSlide1() { index1 = (index1 - 1 + images1.length) % images1.length; updateSlide1(); }

    const images2 = [
      { src: "../billeder/laser/lightburn/01tom_skaerm.jpeg", caption: "1. Start Lightburn or select 'New' in the File tab" },
      { src: "../billeder/laser/lightburn/02reset_to_default.jpeg", caption: "2. Restore default settings if functions are missing" },
      { src: "../billeder/laser/lightburn/03importer_tegning.jpeg", caption: "3. Import drawing" },
      { src: "../billeder/laser/lightburn/04farver.jpeg", caption: "4. Check that all layers/colors you need are present" },
      { src: "../billeder/laser/lightburn/05vaelg_farve.jpeg", caption: "5. Select e.g. the cut layer" },
      { src: "../billeder/laser/lightburn/06skaering.jpeg", caption: "6. Select material and function in the material library and click 'Assign'" },
      { src: "../billeder/laser/lightburn/07fyld_gravering.jpeg", caption: "7. Full engraving = filled shape" },
      { src: "../billeder/laser/lightburn/08linje_gravering.jpeg", caption: "8. Line engraving = empty shape" },
      { src: "../billeder/laser/lightburn/09skift_til_laser.jpeg", caption: "9. Switch to laser view" },
      { src: "../billeder/laser/lightburn/10marker_hele_figuren.jpeg", caption: "10. Select everything to be cut/engraved" },
      { src: "../billeder/laser/lightburn/11saet_origin_ightburn.jpeg", caption: "11. Select origin in Lightburn" },
      { src: "../billeder/laser/lightburn/12saet_origin_paa_laser.jpeg", caption: "12. Set the same origin physically on the machine" },
      { src: "../billeder/laser/lightburn/13frame_og_start_laser.jpeg", caption: "13. Use 'Frame' and start the laser" }
    ];
    let index2 = 0;
    function updateSlide2() {
      document.getElementById("carouselImage2").src = images2[index2].src;
      document.getElementById("carouselCaption2").textContent = images2[index2].caption;
    }
    function nextSlide2() { index2 = (index2 + 1) % images2.length; updateSlide2(); }
    function prevSlide2() { index2 = (index2 - 1 + images2.length) % images2.length; updateSlide2(); }

    updateSlide0();
    updateSlide1();
    updateSlide2();

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').style.display = 'block';
    }
    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }
    window.onclick = function(event) {
      var modal = document.getElementById('imageModal');
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
